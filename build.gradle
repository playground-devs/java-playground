plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.17'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.playground'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '11'
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	// https://mvnrepository.com/artifact/com.google.guava/guava
	implementation group: 'com.google.guava', name: 'guava', version: '22.0'
    // Excel parsing for .xlsx input
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
//	implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.1'
//	implementation group: 'jakarta.annotation', name: 'jakarta.annotation-api', version: '3.0.0'
//	implementation group: 'jakarta.validation', name: 'jakarta.validation-api', version: '3.1.0'
//	implementation group: 'jakarta.xml.bind', name: 'jakarta.xml.bind-api', version: '4.0.2'
//	implementation group: 'jakarta.ws.rs', name: 'jakarta.ws.rs-api', version: '3.1.0'
	implementation 'javax.xml.bind:jaxb-api:2.3.1'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.13.1'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'
	implementation 'com.fasterxml.jackson.core:jackson-core:2.16.1'
	implementation 'org.slf4j:slf4j-api:1.7.32'

	// H2 Database (in-memory, for demo)
	runtimeOnly 'com.h2database:h2'

	// Optional: Lombok (for getter/setter generation)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	//implementation 'org.slf4j:slf4j-simple:1.7.32'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Convenience task to run the rebalancer without affecting Spring Boot main
tasks.register('rebalance', JavaExec) {
    group = 'application'
    description = 'Run portfolio rebalancer CLI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = (project.findProperty('mainClass') ?: 'com.portfolio.rebalance.SimpleRebalance') as String
    if (project.hasProperty('input')) {
        args(project.property('input'))
    }
    if (project.hasProperty('output')) {
        args(project.property('output'))
    }
}
